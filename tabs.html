<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #1e1e1e; overflow: hidden; font-family: sans-serif; }
        #tab-bar { display: flex; background: #252526; height: 32px; align-items: center; padding-left: 5px; border-bottom: 1px solid #181818; overflow-x: auto; }
        .tab { display: flex; align-items: center; background: #2d2d2d; color: #969696; padding: 0 12px; height: 100%; font-size: 12px; cursor: pointer; border-right: 1px solid #181818; user-select: none; white-space: nowrap; }
        .tab.active { background: #1e1e1e; color: #fff; border-top: 2px solid #007acc; }
        .tab span.title { outline: none; }
        .tab .close { margin-left: 8px; font-size: 14px; opacity: 0.6; }
        .tab .close:hover { opacity: 1; color: #ff4d4d; }
        #new-tab { background: transparent; border: none; color: #fff; font-size: 18px; cursor: pointer; padding: 0 12px; height: 100%; }
        #new-tab:hover { background: #333; }
        #editor-container { width: 100%; height: calc(100% - 32px); position: relative; }
        .editor-pane { width: 100%; height: 100%; position: absolute; display: none; top: 0; left: 0; }
        .editor-pane.active { display: block; }
    </style>
</head>
<body>
    <div id="tab-bar">
        <div id="tabs-list" style="display: flex;"></div>
        <button id="new-tab" onclick="createNewTab()">+</button>
    </div>
    <div id="editor-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>
    <script>
        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min' }});
        
        let tabs = [];
        let activeTabId = null;
        let tabCounter = 1;

        require(['vs/editor/editor.main'], function() {
            loadSavedTabs();
        });

        function createNewTab(name = null, content = '-- Write your script here\n') {
            const id = 'tab_' + Date.now() + Math.random().toString(36.substring(2, 5));
            const tabName = name || `New Tab ${tabCounter++}`;

            const tabEl = document.createElement('div');
            tabEl.className = 'tab';
            tabEl.id = 'btn_' + id;
            
            const titleSpan = document.createElement('span');
            titleSpan.className = 'title';
            titleSpan.textContent = tabName;
            titleSpan.spellcheck = false;

            // Переименование по двойному клику
            titleSpan.ondblclick = (e) => {
                e.stopPropagation();
                titleSpan.contentEditable = "true";
                titleSpan.focus();
            };

            titleSpan.onblur = () => {
                titleSpan.contentEditable = "false";
                saveTabsState();
            };

            titleSpan.onkeydown = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    titleSpan.blur();
                }
            };

            const closeSpan = document.createElement('span');
            closeSpan.className = 'close';
            closeSpan.innerHTML = '&times;';
            closeSpan.onclick = (e) => closeTab(e, id);

            tabEl.appendChild(titleSpan);
            tabEl.appendChild(closeSpan);
            tabEl.onclick = () => switchTab(id);
            document.getElementById('tabs-list').appendChild(tabEl);

            const paneEl = document.createElement('div');
            paneEl.className = 'editor-pane';
            paneEl.id = 'pane_' + id;
            document.getElementById('editor-container').appendChild(paneEl);

            const editor = monaco.editor.create(paneEl, {
                value: content,
                language: 'lua',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14
            });

            editor.onDidChangeModelContent(() => {
                saveTabsState();
            });

            tabs.push({ id, editor, tabEl, paneEl, titleSpan });
            switchTab(id);
            saveTabsState();
        }

        function switchTab(id) {
            tabs.forEach(t => {
                if (t.id === id) {
                    t.tabEl.classList.add('active');
                    t.paneEl.classList.add('active');
                    t.editor.layout();
                    activeTabId = t.id;
                } else {
                    t.tabEl.classList.remove('active');
                    t.paneEl.classList.remove('active');
                }
            });
        }

        function closeTab(event, id) {
            event.stopPropagation();
            if (tabs.length <= 1) return;

            const index = tabs.findIndex(t => t.id === id);
            if (index !== -1) {
                tabs[index].tabEl.remove();
                tabs[index].paneEl.remove();
                tabs[index].editor.dispose();
                tabs.splice(index, 1);

                if (activeTabId === id) {
                    switchTab(tabs[tabs.length - 1].id);
                }
                saveTabsState();
            }
        }

        function saveTabsState() {
            try {
                const data = tabs.map(t => ({
                    name: t.titleSpan.textContent,
                    content: t.editor.getValue()
                }));
                localStorage.setItem('spectre_tabs', JSON.stringify(data));
            } catch (err) {}
        }

        function loadSavedTabs() {
            try {
                const saved = localStorage.getItem('spectre_tabs');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed && parsed.length > 0) {
                        parsed.forEach(item => createNewTab(item.name, item.content));
                        return;
                    }
                }
            } catch (err) {}
            // Дефолтная вкладка, если сохранений нет
            createNewTab('New Tab 1', 'print("Hello from Spectre")');
        }

        function getActiveEditorText() {
            const current = tabs.find(t => t.id === activeTabId);
            return current ? current.editor.getValue() : '';
        }
    </script>
</body>
</html>

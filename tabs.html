<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #1e1e1e; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        #top-bar { display: flex; height: 35px; background: #252526; border-bottom: 1px solid #181818; align-items: center; }
        
        #tabs-container { 
            display: flex; 
            flex-direction: row; 
            overflow-x: auto; 
            overflow-y: hidden; 
            flex-grow: 1; 
            height: 100%; 
            scroll-behavior: smooth;
            scrollbar-width: thin;
            scrollbar-color: #424242 #252526;
        }
        #tabs-container::-webkit-scrollbar { height: 4px; }
        #tabs-container::-webkit-scrollbar-track { background: #252526; }
        #tabs-container::-webkit-scrollbar-thumb { background: #424242; border-radius: 2px; }

        .tab { 
            display: flex; 
            align-items: center; 
            background: #2d2d2d; 
            color: #969696; 
            padding: 0 15px; 
            height: 100%; 
            font-size: 12px; 
            cursor: pointer; 
            border-right: 1px solid #181818; 
            user-select: none; 
            white-space: nowrap;
            flex-shrink: 0;
        }
        .tab.active { background: #1e1e1e; color: #fff; border-top: 2px solid #007acc; }
        .tab span.title { outline: none; }
        .tab .close { margin-left: 8px; font-size: 14px; opacity: 0.6; }
        .tab .close:hover { opacity: 1; color: #ff4d4d; }

        #new-tab-btn { 
            background: #252526; 
            border: none; 
            color: #fff; 
            font-size: 16px; 
            cursor: pointer; 
            width: 35px; 
            height: 35px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            flex-shrink: 0;
            border-left: 1px solid #181818;
        }
        #new-tab-btn:hover { background: #333333; color: #007acc; }

        #editor-container { width: 100%; height: calc(100% - 35px); position: relative; }
        
        /* Кастомное текстовое поле вместо тяжелого Monaco, которое никогда не зависает */
        .editor-pane { 
            width: 100%; 
            height: 100%; 
            position: absolute; 
            display: none; 
            top: 0; 
            left: 0; 
            background: #1e1e1e; 
            color: #d4d4d4; 
            font-family: 'Consolas', 'Courier New', monospace; 
            font-size: 14px; 
            padding: 10px; 
            box-sizing: border-box; 
            border: none; 
            outline: none; 
            resize: none; 
            line-height: 1.5;
            white-space: pre;
            overflow: auto;
        }
        .editor-pane.active { display: block; }
    </style>
</head>
<body>
    <div id="top-bar">
        <div id="tabs-container">
            <div id="tabs-list" style="display: flex; flex-direction: row; height: 100%;"></div>
        </div>
        <button id="new-tab-btn" onclick="createNewTab()">+</button>
    </div>
    <div id="editor-container"></div>

    <script>
        let tabs = [];
        let activeTabId = null;
        let tabCounter = 1;

        const container = document.getElementById('tabs-container');
        container.addEventListener('wheel', (evt) => {
            if (evt.deltaY !== 0) {
                evt.preventDefault();
                container.scrollLeft += evt.deltaY;
            }
        });

        // Запуск при старте
        window.onload = function() {
            loadSavedTabs();
        };

        function createNewTab(name = null, content = 'print("Hello from Spectre")') {
            const id = 'tab_' + Date.now() + Math.random().toString(36).substring(2, 5);
            const tabName = name || `New Tab ${tabCounter++}`;

            const tabEl = document.createElement('div');
            tabEl.className = 'tab';
            tabEl.id = 'btn_' + id;
            
            const titleSpan = document.createElement('span');
            titleSpan.className = 'title';
            titleSpan.textContent = tabName;
            titleSpan.spellcheck = false;

            // Двойной клик для переименования
            titleSpan.ondblclick = (e) => {
                e.stopPropagation();
                titleSpan.contentEditable = "true";
                titleSpan.focus();
            };

            titleSpan.onblur = () => {
                titleSpan.contentEditable = "false";
                saveTabsState();
            };

            titleSpan.onkeydown = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    titleSpan.blur();
                }
            };

            const closeSpan = document.createElement('span');
            closeSpan.className = 'close';
            closeSpan.innerHTML = '&times;';
            closeSpan.onclick = (e) => closeTab(e, id);

            tabEl.appendChild(titleSpan);
            tabEl.appendChild(closeSpan);
            tabEl.onclick = () => switchTab(id);
            document.getElementById('tabs-list').appendChild(tabEl);

            // Создаем textarea вместо тяжелого редактора
            const textarea = document.createElement('textarea');
            textarea.className = 'editor-pane';
            textarea.id = 'pane_' + id;
            textarea.value = content;
            textarea.spellcheck = false;

            textarea.oninput = () => {
                saveTabsState();
            };

            // Поддержка табуляции (нажатие Tab внутри редактора)
            textarea.onkeydown = (e) => {
                if (e.key === 'Tab') {
                    e.preventDefault();
                    const start = textarea.selectionStart;
                    const end = textarea.selectionEnd;
                    textarea.value = textarea.value.substring(0, start) + "    " + textarea.value.substring(end);
                    textarea.selectionStart = textarea.selectionEnd = start + 4;
                    saveTabsState();
                }
            };

            document.getElementById('editor-container').appendChild(textarea);

            tabs.push({ id, textarea, tabEl, titleSpan });
            switchTab(id);
            saveTabsState();

            container.scrollLeft = container.scrollWidth;
        }

        function switchTab(id) {
            tabs.forEach(t => {
                if (t.id === id) {
                    t.tabEl.classList.add('active');
                    t.textarea.classList.add('active');
                    t.textarea.focus();
                    activeTabId = t.id;
                } else {
                    t.tabEl.classList.remove('active');
                    t.textarea.classList.remove('active');
                }
            });
        }

        function closeTab(event, id) {
            event.stopPropagation();
            if (tabs.length <= 1) return;

            const index = tabs.findIndex(t => t.id === id);
            if (index !== -1) {
                tabs[index].tabEl.remove();
                tabs[index].textarea.remove();
                tabs.splice(index, 1);

                if (activeTabId === id) {
                    switchTab(tabs[tabs.length - 1].id);
                }
                saveTabsState();
            }
        }

        function saveTabsState() {
            try {
                const data = tabs.map(t => ({
                    name: t.titleSpan.textContent,
                    content: t.textarea.value
                }));
                localStorage.setItem('spectre_tabs', JSON.stringify(data));
            } catch (err) {}
        }

        function loadSavedTabs() {
            try {
                const saved = localStorage.getItem('spectre_tabs');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    if (parsed && parsed.length > 0) {
                        parsed.forEach(item => createNewTab(item.name, item.content));
                        return;
                    }
                }
            } catch (err) {}
            createNewTab('New Tab 1', 'print("Hello from Spectre")');
        }

        // Функция для C# чтобы забрать текст
        function getActiveEditorText() {
            const current = tabs.find(t => t.id === activeTabId);
            return current ? current.textarea.value : '';
        }
    </script>
</body>
</html>
